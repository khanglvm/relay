name: Publish npm package

on:
  push:
    branches: [main]
    paths: [package.json]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and pack without publishing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use npm with trusted publishing support
        run: npm install --global npm@11
      - name: Check release identity and registry
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const output = (key, value) => fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          const expectedRepository = `git+https://github.com/${process.env.GITHUB_REPOSITORY}.git`;
          if (pkg.repository?.url !== expectedRepository) throw new Error(`repository.url must be ${expectedRepository}`);
          if (!pkg.name || !pkg.version || pkg.private) throw new Error('A public package name and version are required');
          const isTag = process.env.GITHUB_REF_TYPE === 'tag';
          if (isTag && process.env.GITHUB_REF_NAME !== `v${pkg.version}`) {
            throw new Error(`Release tag must equal v${pkg.version}`);
          }
          let changed = true;
          if (process.env.EVENT_NAME === 'push' && !isTag && !/^0+$/.test(process.env.BEFORE_SHA || '')) {
            const previous = spawnSync('git', ['show', `${process.env.BEFORE_SHA}:package.json`], { encoding: 'utf8' });
            if (previous.status !== 0) throw new Error('Cannot read package.json before this push');
            changed = JSON.parse(previous.stdout).version !== pkg.version;
          }
          output('dist_tag', pkg.version.split('+')[0].includes('-') ? 'next' : 'latest');
          if (!changed) {
            output('publish', false);
            console.log('Package version is unchanged; publishing is skipped.');
            process.exit(0);
          }
          const spec = `${pkg.name}@${pkg.version}`;
          const result = spawnSync('npm', ['view', spec, 'version', '--json', '--registry=https://registry.npmjs.org/'], { encoding: 'utf8' });
          if (result.error) throw result.error;
          let response;
          try { response = JSON.parse(result.stdout); }
          catch { throw new Error(`Registry returned an unreadable response (exit ${result.status})`); }
          if (result.status === 0) {
            if (response !== pkg.version) throw new Error('Registry returned an unexpected version');
            output('publish', false);
            console.log(`${spec} already exists; publishing is skipped.`);
          } else if (response?.error?.code === 'E404') {
            output('publish', true);
            console.log(`${spec} is absent and can be published after validation.`);
          } else {
            throw new Error(`Registry lookup failed: ${response?.error?.code || result.status}`);
          }
          NODE
      - name: Run release checks
        if: steps.release.outputs.publish == 'true' || inputs.dry_run
        run: |
          npm test
      - name: Inspect package contents
        if: steps.release.outputs.publish == 'true' || inputs.dry_run
        run: npm pack --dry-run
      - name: Publish with npm trusted publishing
        if: steps.release.outputs.publish == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: npm publish --ignore-scripts --provenance --access public --tag "$DIST_TAG"
